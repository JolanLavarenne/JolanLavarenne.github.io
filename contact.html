<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio Jolan Lavarenne</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header></header>

    <main class="container contact-section">
        
        <div class="section-header">
            <h1>Contactez-moi</h1>
            <p style="color: var(--text-secondary);">Une opportunité de stage ou une question ? N'hésitez pas à m'écrire.</p>
        </div>

        <div class="contact-wrapper">
            
            <div class="contact-info">
                
                <div class="info-card">
                    <div class="icon-box"><i class="fas fa-phone-alt"></i></div>
                    <div class="info-content">
                        <h3>Téléphone</h3>
                        <a href="tel:+33619830492">06 19 83 04 92</a>
                    </div>
                </div>

                <div class="info-card">
                    <div class="icon-box"><i class="fas fa-envelope"></i></div>
                    <div class="info-content">
                        <h3>Email</h3>
                        <a href="mailto:Jolan.pro@hotmail.com">Jolan.pro@hotmail.com</a>
                    </div>
                </div>

                <div class="info-card">
                    <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
                    <div class="info-content">
                        <h3>Localisation</h3>
                        <p>Amiens, France<br></p>
                    </div>
                </div>

            </div>

            <div class="contact-form">
                <form action="https://formspree.io/f/mvzbldow" method="POST">
                    
                    <div class="form-group">
                        <label class="form-label">Votre Nom</label>
                        <input type="text" name="name" class="form-input" placeholder="Jean Dupont" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Votre Email</label>
                        <input type="email" name="email" class="form-input" placeholder="jean@exemple.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Sujet</label>
                        <input type="text" name="subject" class="form-input" placeholder="Proposition de stage..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Message</label>
                        <textarea name="message" class="form-textarea" placeholder="Votre message ici..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        Envoyer le message <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>

        </div>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Jolan Lavarenne - Portfolio BTS SIO.</p>
        </div>
    </footer>

    <script src="menu.js"></script>
</body>
</html>
